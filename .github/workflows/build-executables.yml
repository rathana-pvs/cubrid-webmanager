# CI: Runs automatically on GitHub push/PR. Check the Actions tab for success/failure.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Install, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck api-server
        run: npx tsc -p apps/api-server/tsconfig.app.json --noEmit

      - name: Build all projects
        run: npx nx run-many --target=build --all

      # Artifact: Nx build output (dist only, including main.js), uploaded only for direct pushes to develop in the official repository.
      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'cubrid/cubrid-webmanager'
        uses: actions/upload-artifact@v4
        with:
          name: cubrid-webmanager-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
